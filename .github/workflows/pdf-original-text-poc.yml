name: Original PDF Text Editing Research
on:
  push:
    branches:
      - feature/original-text-edit-poc
    paths:
      - poc/original-text-edit/**
      - .github/workflows/pdf-original-text-poc.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free open-source PDF engine
        run: python -m pip install 'pdf-edit-engine==0.2.0' 'reportlab>=4.0' 'fpdf2>=2.8,<3' 'pypdfium2>=4,<6' 'fastapi>=0.115,<1' 'httpx>=0.28,<1' 'python-multipart>=0.0.20,<1' 'uvicorn>=0.30,<1'
      - name: Run real original-text replacement test
        run: python poc/original-text-edit/proof.py
      - name: Verify strict preflight and fail-closed editing
        run: python poc/original-text-edit/test_strict.py
      - name: Verify loopback-only original-text editing service
        run: python poc/original-text-edit/test_local_api.py
      - name: Check static local editor JavaScript
        run: node --check poc/original-text-edit/local_editor.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mobile UI against loopback-only API
        run: |
          npm install --no-save playwright@1.56.0
          PYTHONPATH=poc/original-text-edit python -c "from pathlib import Path; from proof import make_chinese_cid; make_chinese_cid(Path('poc/original-text-edit/results/sample_cjk.pdf'))"
          python -m uvicorn local_server:app --app-dir poc/original-text-edit --host 127.0.0.1 --port 8765 > /tmp/pdf-local-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8765/health >/dev/null; then
            echo "Local test service failed to start"; cat /tmp/pdf-local-server.log
            exit 1
          fi
          node poc/original-text-edit/test_mobile.mjs
      - name: Upload fidelity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-text-fidelity-report
          path: |
            poc/original-text-edit/results/report.json
            poc/original-text-edit/results/strict_policy_report.json
            poc/original-text-edit/results/*_edited.pdf
          if-no-files-found: warn
          retention-days: 7
